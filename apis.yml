aid: 7ai
name: 7AI
description: >-
  7AI (Seven AI, Inc.) is a Boston-based cybersecurity company building an agentic
  security platform that offloads repetitive, non-human security-operations work to
  swarming AI agents. Founded in 2024 by Cybereason co-founders Lior Div and Yonatan
  Striem-Amit, 7AI delivers "Service as Software" for the SOC: autonomous agents
  ingest and triage alerts, enrich data, and run end-to-end investigations, response,
  threat hunting, and case management so human analysts focus on high-value work. The
  platform spans Cases, Investigations, Detection, Response, Hunting, and Enterprise
  Insights. 7AI is a Greylock-backed portfolio company and raised the largest
  cybersecurity Series A on record. This API Evangelist profile is a company/identity
  record; 7AI does not publish a public developer API, SDK, or developer portal at the
  time of enrichment.
